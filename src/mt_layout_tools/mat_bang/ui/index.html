<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MT Mặt Bằng</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-head">
    <div class="identity"><span class="mark">MT</span><span>Mặt bằng</span></div>
    <input id="project-name" maxlength="100" aria-label="Tên dự án" placeholder="Tên dự án">
    <span id="save-state" aria-live="polite"></span>
    <div class="head-actions">
      <button id="save" class="quiet">Lưu vào SKP</button>
      <button id="build" class="primary">Dựng / cập nhật 3D</button>
      <button id="export-toggle" class="quiet" aria-expanded="false">Xuất bản vẽ ▾</button>
    </div>
  </header>
  <main>
    <nav aria-label="Công cụ vẽ">
      <div class="nav-label">Vẽ mặt bằng</div>
      <div id="tools">
        <button data-tool="select" title="Chọn (V)"><b>↖</b> Chọn <kbd>V</kbd></button>
        <button data-tool="wall" title="Vẽ tường (W)"><b>▰</b> Tường <kbd>W</kbd></button>
        <button data-tool="door" title="Đặt cửa (D)"><b>◔</b> Cửa đi <kbd>D</kbd></button>
        <button data-tool="window" title="Đặt cửa sổ (O)"><b>▥</b> Cửa sổ <kbd>O</kbd></button>
        <button data-tool="floor" title="Vẽ sàn (F)"><b>▧</b> Sàn / phòng <kbd>F</kbd></button>
        <button data-tool="furniture" title="Đặt đồ (B)"><b>⊞</b> Nội thất <kbd>B</kbd></button>
        <button data-tool="dimension" title="Ghi kích thước (M)"><b>↔</b> Kích thước <kbd>M</kbd></button>
        <button data-tool="pan" title="Kéo khung nhìn (H)"><b>✥</b> Kéo khung <kbd>H</kbd></button>
      </div>
      <div class="nav-bottom">
        <div class="nav-label">Dự án</div>
        <button id="load-file">Nhập mặt bằng JSON</button>
        <button id="save-file">Lưu mặt bằng JSON</button>
      </div>
    </nav>
    <section class="workspace" aria-label="Bản vẽ mặt bằng">
      <div class="canvas-head">
        <div class="tool-history">
          <button id="undo" title="Hoàn tác (Ctrl+Z)" aria-label="Hoàn tác">↶</button>
          <button id="redo" title="Làm lại (Ctrl+Y)" aria-label="Làm lại">↷</button>
          <span class="split"></span>
          <label><input type="checkbox" id="snap" checked> Bắt điểm</label>
          <select id="step" aria-label="Bước lưới">
            <option>50</option><option selected>100</option><option>200</option><option>500</option>
          </select>
          <span class="unit">mm</span>
        </div>
        <div class="view-toggle" aria-label="Kiểu hiển thị">
          <button id="color" aria-pressed="true">Concept</button>
          <button id="mono" aria-pressed="false">Kỹ thuật</button>
        </div>
      </div>
      <div class="paper" id="paper">
        <svg id="drawing" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Khung vẽ mặt bằng" tabindex="0">
          <defs>
            <pattern id="grid" patternUnits="userSpaceOnUse" width="500" height="500">
              <path d="M 500 0 H 0 V 500" fill="none" stroke="#e6eae7" stroke-width="7"/>
            </pattern>
          </defs>
          <rect id="background" fill="url(#grid)" pointer-events="none"></rect>
          <g id="objects"></g>
          <g id="guide" pointer-events="none"></g>
        </svg>
        <aside id="exports" hidden>
          <div class="panel-kicker">Thiết lập tờ in</div>
          <label>Khổ giấy<select id="paper-size"><option>A3</option><option>A4</option></select></label>
          <label>Tỉ lệ<select id="scale"><option value="20">1:20</option><option value="25">1:25</option><option value="50" selected>1:50</option><option value="75">1:75</option><option value="100">1:100</option><option value="200">1:200</option></select></label>
          <label class="tick"><input type="checkbox" id="sheet-mono" checked> In đen trắng</label>
          <button data-export="pdf">Mặt bằng PDF</button>
          <button data-export="dxf">Mặt bằng DXF · mm</button>
          <button data-export="csv">Thống kê sàn và đồ đạc CSV</button>
          <hr>
          <div class="panel-kicker">Đang chọn trong SketchUp</div>
          <button data-export="views_pdf">Ba hình chiếu PDF</button>
          <button data-export="views_dxf">Ba hình chiếu DXF</button>
          <small>Chọn một Group hoặc Component trong SketchUp để xuất hình chiếu.</small>
        </aside>
        <div class="zoom">
          <button id="zoom-out" aria-label="Thu nhỏ">−</button>
          <button id="fit">Vừa khung</button>
          <button id="zoom-in" aria-label="Phóng to">+</button>
        </div>
      </div>
      <footer><span id="hint" aria-live="polite"></span><span id="coordinates">X 0 · Y 0 mm</span></footer>
    </section>
    <section class="properties" aria-label="Thông số">
      <div class="panel-kicker" id="inspector-kicker">Thông số</div>
      <h1 id="inspector-title">Mặt bằng</h1>
      <div id="inspector"></div>
      <div class="object-head"><span>Đối tượng</span><span id="count"></span></div>
      <div id="object-list" aria-label="Danh sách đối tượng"></div>
      <div class="stats" id="stats"></div>
    </section>
  </main>
  <div id="notice" role="status" hidden></div>
  <script src="plan.js"></script>
  <script src="app.js"></script>
</body>
</html>
